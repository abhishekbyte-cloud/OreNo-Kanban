<li class="task-card" id="task-card-{taskId}" draggable="true" tabindex="0">
    <h4 class="task-title" id="task-title-{taskId}">Design homepage</h4>
    <p class="task-description" id="task-description-{taskId}">Create the wireframe and layout.</p>
    <p class="task-priority" id="task-priority-{taskId}">Priority: High</p>
    <p class="task-deadline" id="task-deadline-{taskId}">Deadline: 2026-12-01</p>
    <button type="button" class="edit-task-button" id="edit-task-button-{taskId}">Edit task</button>
    <button type="button" class="delete-task-button" id="delete-task-button-{taskId}">Delete task</button>
</li>
